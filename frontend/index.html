<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#FFFFFF" /><title>Thread</title>
    <script>
      try {
        var theme = localStorage.getItem('thread.theme.v1');
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (_) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
