apiVersion: v1
kind: Service
metadata:
  name: thread-mongodb
  namespace: grupo-threads
spec:
  selector:
    app: thread-mongodb
  ports:
  - name: tcp
    port: 27017
    targetPort: 27017
  clusterIP: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thread-mongodb-data
  namespace: grupo-threads
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thread-mongodb
  namespace: grupo-threads
spec:
  serviceName: thread-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: thread-mongodb
  template:
    metadata:
      labels:
        app: thread-mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: mongodb
        image: mongo:7
        args:
        - --wiredTigerCacheSizeGB
        - '0.25'
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: thread-secrets
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: thread-secrets
              key: MONGO_INITDB_ROOT_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data/db
        # Avoid starting mongosh for startup/liveness under CPU contention.
        startupProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
          periodSeconds: 20
          timeoutSeconds: 15
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: thread-mongodb-data
